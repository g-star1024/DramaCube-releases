# 飞牛 fnOS（及其他 NAS）Docker Compose 部署示例
#
# 飞牛操作：Docker → Compose → 新增 → 粘贴本文件 → 部署
# 启动后浏览器访问 http://NAS的IP:3000/vnc.html，点 Connect 进入完整桌面版
#
# 数据持久化：/data 卷内保存全部配置 / 数据库 / 图片缓存，升级重建不丢
services:
  dramacube:
    # 版本钉版推荐；滚动更新可改 latest
    image: ghcr.io/g-star1024/dramacube-releases/dramacube:v2.7.82
    container_name: dramacube
    restart: unless-stopped
    ports:
      - "3000:3000"    # 左侧宿主端口冲突可改（如 3001:3000）
    volumes:
      - /vol1/docker/dramacube/data:/data   # 飞牛默认存储路径；群晖/威联通等按各自习惯改
    environment:
      - TZ=Asia/Shanghai

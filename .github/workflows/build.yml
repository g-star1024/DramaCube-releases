# Flutter 全平台打包发布（本公开仓 CI 构建，Actions 免费）
#
# 手动触发（workflow_dispatch）：
#   gh workflow run build.yml -R g-star1024/DramaCube-releases -f ref=main -f version=2.7.8
#   gh workflow run build.yml -R g-star1024/DramaCube-releases -f ref=v2.7.8 -f version=2.7.8
#
# 机制：本仓 workflow 用 SOURCE_PAT checkout 私有源码仓 g-star1024/hongguo-desktop
# 的 Flutter 工程（apps/flutter）→ 五平台矩阵并行构建 → 发布到本仓 Release。
# 私有源码仓零 CI 分钟消耗（不再扣费）。
#
# ⚠️ 本文件是工作区副本（源仓库 hongguo-desktop），真正的 CI 在 DramaCube-releases
# 仓。改动后需同步到 g-star1024/DramaCube-releases/.github/workflows/build.yml。
#
# 平台矩阵：
#   windows   windows-latest  → dramacube-windows-v<ver>.zip
#   linux     ubuntu-latest   → dramacube-linux-v<ver>.tar.gz
#   android   ubuntu-latest   → dramacube-android-v<ver>.apk
#   mac-arm64 macos-14        → dramacube-macOS-arm64-v<ver>.dmg
#   mac-x64   macos-14        → dramacube-macOS-x64-v<ver>.dmg

name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "私有源码仓 hongguo-desktop 的 ref（main / vX.Y.Z tag / commit）"
        required: true
        default: "main"
      version:
        description: "版本号（如 2.7.8，发布 tag 为 v<version>）"
        required: true
      force_ref:
        description: "【push 触发专用】钉死私有源码仓 commit（留空则取 main）"
        required: false
  push:
    branches: [main]

jobs:
  build:
    # 发布态门禁（v2.7.64 起）：仅两种运行进入构建——
    # ① workflow_dispatch 手动触发且传了 version；
    # ② push 触发且提交为版本 bump（提交信息含 'five-platform release'，惯例见历史）。
    # 其余 push（dev 占位符 restore、杂项提交）整 job 跳过：省 5 平台 CI 分钟，
    # 也不再刷新 vdev 滚动发布。
    if: ${{ inputs.version != '' || contains(github.event.head_commit.message, 'five-platform release') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows,   os: windows-latest, flutter: 3.41.0 }
          - { platform: linux,     os: ubuntu-latest,  flutter: 3.35.4 }
          - { platform: android,   os: ubuntu-latest,  flutter: 3.35.4 }
          - { platform: mac-arm64, os: macos-14,       flutter: 3.35.4 }
          - { platform: mac-x64,   os: macos-14,       flutter: 3.35.4 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - name: Checkout 私有源码仓
        uses: actions/checkout@v4
        with:
          repository: g-star1024/hongguo-desktop
          # push 触发时 inputs 为空，用 force_ref 兜底钉死源码 commit，防 main 缓存漂移
          ref: ${{ inputs.ref || inputs.force_ref || '53b61c1df4bc22230532b865218b538ff74420eb' }}
          token: ${{ secrets.SOURCE_PAT }}

      - name: 核对源码版本（防 checkout 到旧代码，v2.7.37 事故教训）
        # 发布构建门禁：比对 pubspec 版本与 workflow 传入的 version，防止 checkout 到旧代码。
        # 改用 inputs.version 动态比对，不再硬编码版本号（避免每次发版漏改导致误判失败）。
        # 必须显式 shell: bash——defaults 只设 working-directory，Windows 默认 pwsh
        # run 块默认 set -e：诊断命令全部 || true，最后才做版本判断
        shell: bash
        run: |
          set +e
          V=$(grep -m1 '^version:' pubspec.yaml); echo "grep_exit=$? V=[$V]"
          echo "pwd: $(pwd)"
          echo "--- pubspec head ---"; head -3 pubspec.yaml; echo "head_exit=$?"
          git log --oneline -1; git rev-parse HEAD
          # 抽取纯语义版本（去掉 +build 后缀，如 2.7.77+75 -> 2.7.77）
          PV=$(echo "$V" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          # 期望版本：优先取 dispatch 传入的 version；push 触发时从提交信息解析
          # （如 "ci: build v2.7.77 five-platform release" -> 2.7.77），与 ref 默认值保持一致
          if [ -n "${{ inputs.version }}" ]; then
            EXPECT="${{ inputs.version }}"
          else
            EXPECT=$(echo "${{ github.event.head_commit.message }}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          fi
          echo "pubspec_version=[$PV] expected=[$EXPECT]"
          set -e
          [ -n "$EXPECT" ] || { echo "❌ 无法确定期望版本，构建中止"; exit 1; }
          [ "$PV" = "$EXPECT" ] || { echo "❌ 源码版本($PV)与发布版本($EXPECT)不符，构建中止"; exit 1; }

      - name: 生成诊断日志
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "run=${{ github.run_id }} platform=${{ matrix.platform }} sha=$(git rev-parse HEAD)"
            git log --oneline -3
            echo "--- pubspec grep ---"
            grep -m1 '^version:' pubspec.yaml; echo "grep_exit=$?"
            echo "--- pubspec head ---"
            head -12 pubspec.yaml; echo "head_exit=$?"
            echo "--- guard simulation ---"
            V=$(grep -m1 '^version:' pubspec.yaml)
            echo "V=[$V]"
            echo "$V" | grep -q "dev" && echo "GUARD WOULD PASS" || echo "GUARD WOULD FAIL"
            echo "--- pwd ---"
            pwd
          } > /tmp/ci-diag.txt 2>&1
          echo "diag_gen_exit=$?"
          cat /tmp/ci-diag.txt

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter（Windows 3.41 支持 VS2026；其他平台固定 3.35.4）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - name: Setup MSVC 工具链
        if: matrix.platform == 'windows'
        uses: microsoft/setup-msbuild@v2

      - name: 依赖
        run: flutter pub get

      - name: 分析
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/flutter-analyze.log

      - name: 构建 Windows（激活 VS DevShell，让 CMake 找到 VS2026 生成器）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          flutter --version
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "VS path: $vsPath"
          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          flutter build windows --release *> "$env:TEMP\flutter-windows-build.log"
          $buildExit = $LASTEXITCODE
          Get-Content "$env:TEMP\flutter-windows-build.log"
          exit $buildExit

      - name: 构建 Linux
        if: matrix.platform == 'linux'
        run: |
          set -o pipefail
          sudo apt-get update
          # tray_manager 需要 appindicator；flutter_secure_storage 需要 libsecret；
          # local_notifier 需要 libnotify。
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv libayatana-appindicator3-dev libsecret-1-dev libnotify-dev
          flutter build linux --release 2>&1 | tee /tmp/flutter-linux-build.log

      - name: 构建 Android
        if: matrix.platform == 'android'
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/flutter-android-build.log

      - name: 构建 macOS
        if: matrix.platform == 'mac-arm64' || matrix.platform == 'mac-x64'
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee /tmp/flutter-macos-build.log

      - name: 打包 Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dramacube-windows-v${{ inputs.version || '2.7.77' }}.zip
          Get-Item dramacube-windows-v${{ inputs.version || '2.7.77' }}.zip | Select-Object Name, Length

      - name: 打包 Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          tar -czf dramacube-linux-v${{ inputs.version || '2.7.77' }}.tar.gz -C build/linux/x64/release/bundle .
          ls -lh dramacube-linux-v${{ inputs.version || '2.7.77' }}.tar.gz

      - name: 整理 Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk dramacube-android-v${{ inputs.version || '2.7.77' }}.apk
          ls -lh dramacube-android-v${{ inputs.version || '2.7.77' }}.apk

      - name: 注入 libtorrent + ffmpeg（macOS，下载引擎 + 封面截帧）
        if: matrix.platform == 'mac-arm64' || matrix.platform == 'mac-x64'
        shell: bash
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          ARCH=$([ "${{ matrix.platform }}" = "mac-arm64" ] && echo "arm64" || echo "x86_64")
          HELPERS="$APP/Contents/Helpers"
          FRAMEWORKS="$APP/Contents/Frameworks"
          mkdir -p "$HELPERS" "$FRAMEWORKS"

          # libtorrent 下载引擎（磁力/BT，进程内 FFI 加载，替换原 aria2 外部进程）
          # 放 Frameworks（Flutter 标准 dylib 位置），DynamicLibrary.open 显式 dlopen。
          LTSRC="macos/Runner/Resources/libtorrent/libtorrent-rasterbar-${ARCH}.dylib"
          [ -f "$LTSRC" ] || { echo "::error::libtorrent dylib missing: $LTSRC"; exit 1; }
          cp "$LTSRC" "$FRAMEWORKS/libtorrent-rasterbar.dylib"
          chmod 755 "$FRAMEWORKS/libtorrent-rasterbar.dylib"
          xattr -d com.apple.quarantine "$FRAMEWORKS/libtorrent-rasterbar.dylib" 2>/dev/null || true
          install_name_tool -id "@rpath/libtorrent-rasterbar.dylib" "$FRAMEWORKS/libtorrent-rasterbar.dylib"
          codesign --force --sign - --options runtime "$FRAMEWORKS/libtorrent-rasterbar.dylib"

          # ffmpeg（NAS 封面截帧，沙箱内可执行）
          FFSRC="macos/Runner/Resources/ffmpeg/ffmpeg-${ARCH}"
          [ -f "$FFSRC" ] || { echo "::error::ffmpeg binary missing: $FFSRC"; exit 1; }
          cp "$FFSRC" "$HELPERS/ffmpeg"
          chmod +x "$HELPERS/ffmpeg"
          xattr -d com.apple.quarantine "$HELPERS/ffmpeg" 2>/dev/null || true
          codesign --force --sign - --options runtime "$HELPERS/ffmpeg"

          ls -lh "$FRAMEWORKS/libtorrent-rasterbar.dylib" "$HELPERS/ffmpeg"
          # 重签整个 .app（使新 entitlements 含 disable-library-validation 生效，
          # 否则沙箱会拒绝 dlopen ad-hoc 签名的 libtorrent dylib / 执行 ffmpeg）
          ENT="macos/Runner/Release.entitlements"
          codesign --force --deep --sign - --entitlements "$ENT" "$APP"
          echo "已重签 $APP（entitlements: $ENT）"
          codesign -d --entitlements - "$APP" 2>&1 | grep -A1 "disable-library-validation" || echo "警告: disable-library-validation 未找到"

      - name: 打包 macOS
        if: matrix.platform == 'mac-arm64' || matrix.platform == 'mac-x64'
        shell: bash
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          ARCH_SUFFIX=$([ "${{ matrix.platform }}" = "mac-arm64" ] && echo "arm64" || echo "x64")
          echo "ARCH_SUFFIX=$ARCH_SUFFIX" >> "$GITHUB_ENV"
          hdiutil create -volname "剧立方" -srcfolder "$APP" -ov -format UDZO "dramacube-macOS-${ARCH_SUFFIX}-v${{ inputs.version || '2.7.77' }}.dmg"
          ls -lh dramacube-macOS-*.dmg

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dramacube-${{ matrix.platform }}-v${{ inputs.version || '2.7.77' }}
          path: |
            apps/flutter/dramacube-*.zip
            apps/flutter/dramacube-*.tar.gz
            apps/flutter/dramacube-*.apk
            apps/flutter/dramacube-*.dmg
          retention-days: 30
          if-no-files-found: error

      - name: 保存构建失败日志
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_DIR="$GITHUB_WORKSPACE/.git"
          export GIT_WORK_TREE="$RUNNER_TEMP/ci-diagnostics"
          # 必须先建好工作树目录，否则 git switch 报 "must be run in a work tree"
          mkdir -p "$GIT_WORK_TREE" "$GIT_WORK_TREE/diagnostics"
          SOURCE_SHA=$(git rev-parse HEAD)
          BRANCH="ci-logs-${{ github.run_id }}-${{ matrix.platform }}"
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            git fetch origin "$BRANCH"
            git switch --detach FETCH_HEAD
          else
            git switch --orphan "$BRANCH"
          fi
          cp /tmp/flutter-*.log /tmp/ci-diag.txt "${RUNNER_TEMP}"/flutter-*.log "$GIT_WORK_TREE/diagnostics/" 2>/dev/null || true
          echo "run=${{ github.run_id }} platform=${{ matrix.platform }} sha=${SOURCE_SHA}" > "$GIT_WORK_TREE/diagnostics/run.txt"
          git add diagnostics
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "ci: diagnostics for ${{ github.run_id }} ${{ matrix.platform }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${BRANCH}"

      - name: 上传诊断 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag-${{ matrix.platform }}
          path: |
            /tmp/ci-diag.txt
            /tmp/flutter-*.log
            ${{ runner.temp }}/flutter-*.log
          if-no-files-found: ignore

      - name: 发布到本仓 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="v${{ inputs.version || '2.7.77' }}"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --title "剧立方 DramaCube ${TAG}" \
              --notes "Flutter 全平台构建（本仓 GitHub Actions）。源码：hongguo-desktop @ 53b61c1df4bc22230532b865218b538ff74420eb"
          fi
          shopt -s nullglob
          files=(dramacube-*.zip dramacube-*.tar.gz dramacube-*.apk dramacube-*.dmg)
          if [ ${#files[@]} -eq 0 ]; then echo "无构建产物可上传"; exit 1; fi
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          echo "已发布： https://github.com/${REPO}/releases/tag/${TAG}"

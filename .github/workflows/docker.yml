# Docker 一键部署版（路线 A）独立重建工作流
#
# 用途：只重建/重发 Docker 镜像，不触发五平台全量构建。
#   - 直接从已发布的 GitHub Release 资产拉取对应版本的 linux 产物
#     （dramacube-linux-v<ver>.tar.gz，永久保存，不依赖 30 天 artifact 保留期）；
#   - 改了 docker/Dockerfile 或 entrypoint.sh 后，用本工作流重发即可。
#
# 手动触发（Actions → docker (rebuild) → Run workflow，填 version，如 2.7.82）：
#   镜像推到 ghcr.io/<owner-lowercase>/dramacube-releases/dramacube:v<ver> 与 :latest
#
# 注：完整五平台发版（build.yml）仍会在发版时自动构建并推送同名 Docker 镜像，
# 本工作流用于「不发版、只重做容器」的场景。

name: docker (rebuild)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "已发布版本号（如 2.7.82，对应 Release v<version> 中的 linux 产物）"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout 本仓（Dockerfile / 入口脚本）
        uses: actions/checkout@v4

      - name: 解析版本号 + 镜像名（小写）
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          echo "RELEASE_VER=$V" >> "$GITHUB_ENV"
          # GHCR 镜像名强制小写（仓库名含大写 → invalid tag）
          IMG="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/dramacube"
          echo "IMAGE=$IMG" >> "$GITHUB_ENV"
          echo "Docker 版本: v$V → $IMG:v$V"

      - name: 下载 Linux 产物（来自永久 Release 资产）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker/bundle
          gh release download "v${{ env.RELEASE_VER }}" \
            --repo "${{ github.repository }}" \
            --pattern "dramacube-linux-v${{ env.RELEASE_VER }}.tar.gz" \
            --dir /tmp/linux-artifact
          tar -xzf "/tmp/linux-artifact/dramacube-linux-v${{ env.RELEASE_VER }}.tar.gz" -C docker/bundle
          [ -x docker/bundle/dramacube ] || { echo "❌ bundle 中找不到 dramacube 可执行文件"; ls docker/bundle; exit 1; }
          ls -lh docker/bundle | head -8

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建 Docker 镜像
        shell: bash
        run: |
          set -o pipefail
          if ! docker build -t "${{ env.IMAGE }}:v${{ env.RELEASE_VER }}" docker/ 2>&1 | tee /tmp/docker-build.log; then
            echo "::group::❌ docker build 失败——日志尾部 60 行"
            tail -60 /tmp/docker-build.log || true
            echo "::endgroup::"
            exit 1
          fi

      - name: 冒烟测试（容器启动 + noVNC 可达 + App 进程存活）
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE }}:v${{ env.RELEASE_VER }}"
          docker run -d --name smoke -p 13000:3000 "$IMAGE"
          sleep 15
          curl -sf -o /dev/null "http://localhost:13000/vnc.html" \
            || { echo "❌ noVNC 页面不可达"; docker logs smoke --tail 50; exit 1; }
          echo "✅ noVNC 页面可达"
          docker exec smoke pgrep -f "dramacube" >/dev/null \
            || { echo "❌ App 进程未存活"; docker logs smoke --tail 80; exit 1; }
          echo "✅ App 进程存活"
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke >/dev/null

      - name: 推送镜像（版本 tag + latest）
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE }}"
          docker tag "$IMAGE:v${{ env.RELEASE_VER }}" "$IMAGE:latest"
          docker push "$IMAGE:v${{ env.RELEASE_VER }}"
          docker push "$IMAGE:latest"
          echo "✅ 已推送 $IMAGE:v${{ env.RELEASE_VER }} 与 :latest"
